name: Docs and web app

# Publishes the documentation website and, under app/, the installable web
# app (PWA) to GitHub Pages.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build documentation site
        run: npm run docs:build

      - name: Build web app into site/app
        run: npm run build:pwa -- --outDir site/app
        env:
          # The public sync server offered in the Sync tab (repository
          # variable; empty = users enter a server themselves).
          VITE_SYNC_SERVER_URL: ${{ vars.SYNC_SERVER_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
