name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver, e.g. 1.1.0)'
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version input
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver version: $VERSION"
            exit 1
          fi

      - name: Check current version
        id: check
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          CURRENT=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "Already at version $VERSION — nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync package version
        if: steps.check.outputs.changed == 'true'
        shell: bash
        run: npm version "${{ inputs.version }}" --no-git-tag-version

      - name: Sync extension manifest version
        if: steps.check.outputs.changed == 'true'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs'
          const path = 'extension/manifest.json'
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))
          manifest.version = process.env.VERSION
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n')
          EOF

      - name: Create release PR with auto-merge
        if: steps.check.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          BRANCH="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Clean up any stale branch from a previous run
          git push origin --delete "$BRANCH" 2>/dev/null || true

          git checkout -b "$BRANCH"
          git add package.json package-lock.json extension/manifest.json
          if git diff --cached --quiet; then
            echo "No files changed — nothing to commit"
            exit 0
          fi
          git commit -m "chore: bump version to $VERSION"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: bump version to $VERSION" \
            --body "Automated version bump to $VERSION." \
            --label release)
          echo "Created PR: $PR_URL"

          gh pr merge --squash --auto --delete-branch "$BRANCH"
          echo "Auto-merge enabled — the publish workflow will take over once merged."