name: Release

# One manual flow: check CI, set the version, build, tag, create the GitHub
# Release, then publish to each selected store in parallel. A failed store can
# be retried with "Re-run failed jobs" without touching the others. If the run
# stops after the tag was pushed, start it again with the same version: it
# resumes from the tag.
#
# main only accepts changes through pull requests, so nothing is pushed to
# main. The version commit exists only on the tag (its parent is the main
# commit that was released); the tags are the record of released versions.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version, X.Y.Z (higher than the latest v* tag)'
        required: true
      chrome:
        description: 'Publish to Chrome Web Store'
        type: boolean
        default: true
      edge:
        description: 'Publish to Edge Add-ons'
        type: boolean
        default: true
      firefox:
        description: 'Publish to Firefox Add-ons'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      stores: ${{ steps.stores.outputs.list }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Stores accept only 1-4 dotted integers of 0-65535 without leading
      # zeros, and reject a version that is not higher than the published
      # one (Chrome: PKG_INVALID_VERSION_NUMBER).
      #
      # If the tag already exists without a GitHub Release, an earlier run
      # stopped after pushing: resume from that tag instead of bumping again.
      - name: Check version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          VERSION=$(echo "$VERSION" | xargs)
          VERSION="${VERSION#v}"
          TAG="v$VERSION"
          PART='(0|[1-9][0-9]{0,4})'
          if [[ ! "$VERSION" =~ ^$PART\.$PART\.$PART$ ]]; then
            echo "::error::\"$VERSION\" is not X.Y.Z (numbers without leading zeros)"
            exit 1
          fi
          for N in ${VERSION//./ }; do
            if [ "$N" -gt 65535 ]; then
              echo "::error::$N is above 65535, the store limit per version part"
              exit 1
            fi
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "::error::$TAG is already released"
              exit 1
            fi
            echo "Tag $TAG exists without a release: resuming from the tag"
            echo "resume=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Highest of the latest release tag and the version on main.
          LATEST_TAG=$(git tag -l 'v[0-9]*' | sed 's/^v//' | sort -V | tail -1)
          CURRENT=$(printf '%s\n%s\n' "$(node -p "require('./package.json').version")" "$LATEST_TAG" | sort -V | tail -1)
          HIGHEST=$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)
          if [ "$VERSION" = "$CURRENT" ] || [ "$HIGHEST" != "$VERSION" ]; then
            echo "::error::$VERSION must be higher than the current version $CURRENT"
            exit 1
          fi
          echo "Releasing $VERSION (current: $CURRENT)"
          echo "resume=false" >> "$GITHUB_OUTPUT"

      # Release only what CI has tested: the main commit must have a green run.
      - name: Require green CI on main
        if: steps.version.outputs.resume == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          CONCLUSION=$(gh run list --workflow ci.yml --commit "$SHA" --event push \
            --limit 1 --json conclusion --jq '.[0].conclusion // ""')
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI for main ${SHA:0:7} is '${CONCLUSION:-missing or running}'. Wait for a green CI run, then start the release again."
            exit 1
          fi

      - name: Check out existing tag
        if: steps.version.outputs.resume == 'true'
        run: git checkout -q "${{ steps.version.outputs.tag }}"

      - name: Select stores
        id: stores
        run: |
          STORES='[]'
          if ${{ inputs.chrome }}; then STORES=$(jq -c '. + ["chrome"]' <<< "$STORES"); fi
          if ${{ inputs.edge }}; then STORES=$(jq -c '. + ["edge"]' <<< "$STORES"); fi
          if ${{ inputs.firefox }}; then STORES=$(jq -c '. + ["firefox"]' <<< "$STORES"); fi
          echo "list=$STORES" >> "$GITHUB_OUTPUT"
          echo "Stores: $STORES"

      - name: Set version
        if: steps.version.outputs.resume == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version
          node -e "
            const fs = require('node:fs')
            const path = 'extension/manifest.json'
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))
            manifest.version = process.env.VERSION
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n')
          "

      - name: Install dependencies
        run: npm ci

      - name: Build app and extension
        run: |
          npm run build
          npm run build:extension

      # Saved before anything is pushed, for the store jobs.
      - name: Keep extension build for the stores
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist-extension
          if-no-files-found: error
          overwrite: true

      # Only version files change, so the CI result of the parent commit
      # still applies. Only the tag is pushed: main is protected and needs a
      # pull request, and the release does not need the commit on main.
      - name: Commit and tag
        if: steps.version.outputs.resume == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json extension/manifest.json
          git commit -m "chore: release $TAG"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          (cd dist && zip -qr "../linkhub-app-$TAG.zip" .)
          (cd dist-extension && zip -qr "../linkhub-extension-$TAG.zip" .)
          gh release create "$TAG" \
            "linkhub-app-$TAG.zip" "linkhub-extension-$TAG.zip" \
            --verify-tag --title "LinkHub $TAG" --generate-notes

  publish:
    name: publish (${{ matrix.store }})
    needs: release
    if: needs.release.outputs.stores != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        store: ${{ fromJSON(needs.release.outputs.stores) }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same build that is attached to the GitHub Release.
      - name: Download extension build
        uses: actions/download-artifact@v4
        with:
          name: extension
          path: dist-extension

      # Each job only receives the secrets of its own store.
      - name: Publish to ${{ matrix.store }}
        env:
          STORE: ${{ matrix.store }}
          CHROME_EXT_ID: ${{ matrix.store == 'chrome' && secrets.CHROME_EXT_ID || '' }}
          CHROME_PUBLISHER_ID: ${{ matrix.store == 'chrome' && secrets.CHROME_PUBLISHER_ID || '' }}
          CHROME_SERVICE_ACCOUNT_JSON: ${{ matrix.store == 'chrome' && secrets.CHROME_SERVICE_ACCOUNT_JSON || '' }}
          EDGE_CLIENT_ID: ${{ matrix.store == 'edge' && secrets.EDGE_CLIENT_ID || '' }}
          EDGE_API_KEY: ${{ matrix.store == 'edge' && secrets.EDGE_API_KEY || '' }}
          EDGE_PRODUCT_ID: ${{ matrix.store == 'edge' && secrets.EDGE_PRODUCT_ID || '' }}
          FIREFOX_JWT_ISSUER: ${{ matrix.store == 'firefox' && secrets.FIREFOX_JWT_ISSUER || '' }}
          FIREFOX_JWT_SECRET: ${{ matrix.store == 'firefox' && secrets.FIREFOX_JWT_SECRET || '' }}
          FIREFOX_EXT_ID: ${{ matrix.store == 'firefox' && secrets.FIREFOX_EXT_ID || '' }}
        run: node extension/deploy.mjs --publish-only "$STORE"
