[package]
name = "linkhaven"
version = "0.0.0"
description = "Linkhaven desktop and mobile app"
authors = ["SchulzOli"]
license = ""
repository = "https://github.com/SchulzOli/Linkhaven"
publish = false
edition = "2024"
rust-version = "1.90"

[lib]
name = "linkhaven_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
